<title>e-GP Watch — who was allowed to bid, who bid, and who won</title>
<meta name="description" content="An investigation built only from the tender notices,
  amendments and contract-award notices published on Bangladesh's e-Procurement portal:
  who could enter each tender, who entered, who was rejected, who won, and how much
  money changed hands. Every figure links to the page it was read from.">
<meta name="robots" content="index, follow">
<meta name="color-scheme" content="light dark">

<!-- The entry document sits at the repository root so that the published site opens
     on the investigation itself. Everything it loads lives under investigation/, and
     the modules address their own files relative to themselves rather than to this
     page, so this file holds no data paths beyond the three below. -->

<!-- Two stylesheets and no third: tokens.css holds the validated palette and the
     type scale, site.css holds the page. Both are in this repository, as is the one
     embedded typeface. Nothing is fetched from another host, here or anywhere in
     this build. -->
<link rel="stylesheet" href="investigation/styles/tokens.css">
<link rel="stylesheet" href="investigation/styles/site.css">

<!-- One icon, drawn in this repository, in the same two colours as the charts. -->
<link rel="icon" type="image/svg+xml" href="investigation/assets/favicon.svg">

<!-- Palette and language, both chosen before the first paint: a reader who has asked
     their system for a dark screen never gets a white flash, and a reader who asked
     for Bangla gets the Bengali face and its leading from the first frame rather than
     watching the page re-set itself. A remembered choice beats the system setting.

     This is the only inline script on the page, and the only place the language is
     resolved twice — investigation/i18n/i18n.js resolves it the same way, from the
     same two places and in the same order, for the modules that follow. It is
     duplicated here because a tab needs a title and <html> needs a lang attribute
     before any module has loaded, and this file cannot import one. The two titles
     below are the only prose in this document that is not paired in the markup. -->
<script>
  (function () {
    var d = document.documentElement;
    try {
      var kept = localStorage.getItem("egp-watch-night");
      var dark = kept === null
        ? window.matchMedia("(prefers-color-scheme: dark)").matches
        : kept === "1";
      if (dark) d.classList.add("night");
    } catch (e) { /* private browsing: fall through to the light palette */ }

    var lang = "en";
    try {
      var q = new URLSearchParams(location.search).get("lang");
      var chosen = q || localStorage.getItem("egp-watch-lang");
      if (chosen === "bn" || chosen === "en") lang = chosen;
    } catch (e) { /* no URL or no storage: fall through to English */ }
    d.lang = lang;
    if (lang === "bn") {
      document.title = "ই-জিপি ওয়াচ — কারা দরপত্রে অংশ নিতে পারত, কারা নিল, কারা জিতল";
      var m = document.querySelector('meta[name="description"]');
      if (m) {
        m.content = "এই অনুসন্ধান দাঁড়িয়ে আছে কেবল বাংলাদেশের ই-প্রকিউরমেন্ট "
          + "পোর্টালে প্রকাশিত দরপত্র বিজ্ঞপ্তি, সংশোধনী ও চুক্তি-প্রদানের "
          + "বিজ্ঞপ্তির উপর: কোন দরপত্রে কারা অংশ নিতে পারত, কারা নিল, কাদের বাদ "
          + "দেওয়া হল, কারা জিতল, এবং কত টাকা হাতবদল হল। প্রতিটি সংখ্যার সঙ্গে সেই "
          + "পাতার লিংক আছে যেখান থেকে তা পড়া হয়েছে।";
      }
    }
  }());
</script>
