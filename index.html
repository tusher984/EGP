<!-- Both editions of the title and the description live here, in the markup, so a
     crawler and a reader with no JavaScript get them. site/scripts/app.js picks the
     pair that matches the edition being read; it does not invent either string. -->
<title data-bn="e-GP ওয়াচ — কারা দরপত্রে অংশ নিতে পারত, কারা নিল, কারা জিতল">e-GP Watch — who was allowed to bid, who bid, and who won</title>
<meta name="description"
  data-bn="এই অনুসন্ধান দাঁড়িয়ে আছে কেবল বাংলাদেশের ছয়টি নগর উন্নয়ন সংস্থার প্রকাশিত দরপত্র বিজ্ঞপ্তি ও চুক্তি-প্রদানের বিজ্ঞপ্তির উপর: কোন দরপত্রে কারা অংশ নিতে পারত, কারা নিল, কাদের বাদ দেওয়া হল, কারা জিতল, এবং কত টাকা হাতবদল হল। প্রতিটি সংখ্যার সঙ্গে সেই পাতার লিংক আছে যেখান থেকে তা পড়া হয়েছে।"
  content="An investigation built only from the tender notices and contract-award notices
  published by six of Bangladesh's urban development authorities: who could enter each
  tender, who entered, who was rejected, who won, and how much money changed hands.
  Every figure links to the page it was read from.">
<meta name="robots" content="index, follow">
<meta name="color-scheme" content="light dark">

<!-- The entry document sits at the repository root so the published site opens on the
     investigation itself. Everything it loads is under site/, and each module addresses
     its own files relative to itself, so this file holds no data paths at all. -->

<!-- Two stylesheets and no third: tokens.css holds the palette, the type scale and the
     one embedded typeface; site.css holds the page. Both are in this repository.
     Nothing is fetched from another host, here or anywhere in this build. -->
<link rel="stylesheet" href="site/styles/tokens.css">
<link rel="stylesheet" href="site/styles/site.css">
<link rel="icon" type="image/svg+xml" href="site/assets/favicon.svg">

<!-- Palette and edition, both settled before the first paint: a reader who asked their
     system for a dark screen never gets a white flash, and a reader who asked for
     Bangla gets the Bengali face from the first frame rather than watching the page
     re-set itself. A remembered choice beats the system setting. This is the only
     inline script on the page; app.js reads what it decided rather than deciding
     again, so the two cannot disagree. -->
<script>
  (function () {
    var d = document.documentElement;
    try {
      var kept = localStorage.getItem("egp-watch-theme");
      var dark = kept === null
        ? window.matchMedia("(prefers-color-scheme: dark)").matches
        : kept === "dark";
      if (dark) d.classList.add("dark-mode");
    } catch (e) { /* private browsing: fall through to the light palette */ }

    var lang = "en";
    try {
      var q = new URLSearchParams(location.search).get("lang");
      var chosen = q || localStorage.getItem("egp-watch-lang");
      if (chosen === "bn" || chosen === "en") lang = chosen;
    } catch (e) { /* no URL or no storage: fall through to English */ }
    d.lang = lang;
  }());
</script>
